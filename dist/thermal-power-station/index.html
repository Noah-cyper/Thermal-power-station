<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThermoSCADA — Nhà máy Nhiệt điện</title>
  <meta name="description" content="Hệ SCADA trình bày trên web cho nhà máy nhiệt điện than — HMI mô phỏng, chạy hoàn toàn trên trình duyệt." />
  <style>
/* =====================================================================
   THERMOSCADA — Design System
   Ngôn ngữ thiết kế cho HMI nhà máy nhiệt điện (dark shell + light content).
   Bảng màu trạng thái đối chiếu chuẩn dataviz: mỗi trạng thái luôn kèm
   icon + nhãn chữ, không bao giờ chỉ dựa vào màu.
   ===================================================================== */

:root {
  /* --- Shell (sidebar + topbar tối) --- */
  --shell-bg:        #0c1a2e;
  --shell-bg-2:      #0a1524;
  --shell-line:      #1c2f49;
  --shell-chip:      #14273f;
  --shell-chip-2:    #172c46;
  --shell-text:      #aab9d1;
  --shell-text-dim:  #6f83a1;
  --shell-text-hi:   #ffffff;

  /* --- Content (nền sáng, thẻ trắng) --- */
  --bg:              #eef1f6;
  --bg-2:            #e7ebf2;
  --surface:         #ffffff;
  --surface-2:       #f7f9fc;
  --surface-3:       #f0f3f8;
  --line:            #e2e8f1;
  --line-2:          #eef1f6;
  --line-strong:     #d3dbe6;

  /* --- Ink --- */
  --ink:             #0f1e33;
  --ink-2:           #37465c;
  --muted:           #6b7a90;
  --muted-2:         #93a1b5;

  /* --- Thương hiệu / accent --- */
  --brand:           #2563eb;
  --brand-2:         #1d70e0;
  --brand-ink:       #1a4fb0;
  --measure:         #2b7fd4;   /* màu số đo (blue) */
  --brand-wash:      #e8f0fe;

  /* --- Trạng thái (cố định, không theo theme) --- */
  --ok:              #16a34a;   /* Normal / Validated / Healthy / Online */
  --ok-strong:       #15803d;
  --ok-wash:         #e6f6ec;
  --ok-line:         #b6e2c4;

  --warn:            #e08600;   /* Warning / Degraded */
  --warn-strong:     #b45c00;
  --warn-wash:       #fdf1dd;
  --warn-line:       #f3d59a;

  --alarm:           #dc2626;   /* Alarm / Trip / Offline */
  --alarm-strong:    #b91c1c;
  --alarm-wash:      #fdeaea;
  --alarm-line:      #f3c2c2;

  --info:            #2563eb;
  --info-wash:       #e8f0fe;
  --info-line:       #c2d6f7;

  /* --- Chuỗi dữ liệu cho đồ thị (categorical, đã kiểm định CVD) --- */
  --series-1:        #2b7fd4;   /* blue   */
  --series-2:        #6b7a90;   /* slate  */
  --series-3:        #e08600;   /* amber  */
  --series-4:        #1baf7a;   /* aqua   */
  --series-5:        #e34948;   /* red    */
  --series-6:        #8b5cf6;   /* violet */

  /* --- Hình học --- */
  --r-sm: 6px;
  --r:    9px;
  --r-lg: 13px;
  --r-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(15,30,51,.06), 0 1px 3px rgba(15,30,51,.05);
  --shadow:    0 1px 2px rgba(15,30,51,.06), 0 4px 14px rgba(15,30,51,.07);
  --shadow-lg: 0 8px 30px rgba(15,30,51,.12);

  /* --- Chữ --- */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;

  --sidebar-w: 236px;
  --topbar-h: 62px;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1,h2,h3,h4,p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
ul { margin: 0; padding: 0; list-style: none; }
::selection { background: rgba(37,99,235,.18); }

/* Scrollbar */
* { scrollbar-width: thin; scrollbar-color: #c3cde0 transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: #c3cde0; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: #a9b6cf; background-clip: content-box; }

/* ---------- Tiện ích chữ ---------- */
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.tag-code { font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em; color: var(--muted); }
.eyebrow {
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
}
.dim { color: var(--muted); }

/* ---------- Trạng thái: chữ + màu ---------- */
.is-ok    { color: var(--ok-strong); }
.is-warn  { color: var(--warn-strong); }
.is-alarm { color: var(--alarm-strong); }
.is-info  { color: var(--brand-ink); }

/* ---------- Badge (icon + nhãn, không chỉ màu) ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px 2px 7px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 650; line-height: 1.7;
  border: 1px solid transparent; white-space: nowrap;
}
.badge svg { width: 12px; height: 12px; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge--ok    { color: var(--ok-strong);    background: var(--ok-wash);    border-color: var(--ok-line); }
.badge--warn  { color: var(--warn-strong);  background: var(--warn-wash);  border-color: var(--warn-line); }
.badge--alarm { color: var(--alarm-strong); background: var(--alarm-wash); border-color: var(--alarm-line); }
.badge--info  { color: var(--brand-ink);    background: var(--info-wash);  border-color: var(--info-line); }
.badge--muted { color: var(--muted);        background: var(--surface-3);  border-color: var(--line); }

/* Chip nhỏ trên nền tối (topbar) */
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px; border-radius: var(--r-pill);
  background: var(--shell-chip); border: 1px solid var(--shell-line);
  color: var(--shell-text); font-size: 12.5px; font-weight: 550;
}
.chip b { color: var(--shell-text-hi); font-weight: 650; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip svg { width: 14px; height: 14px; opacity: .85; }

/* Nút phân đoạn */
.seg { display: inline-flex; background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 2px; }
.seg button {
  padding: 4px 12px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600;
  color: var(--muted); transition: all .12s;
}
.seg button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* Nút bấm chung */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px;
  border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line-strong);
  color: var(--ink-2); font-size: 12.5px; font-weight: 600; transition: all .12s;
}
.btn:hover { border-color: #b7c4d6; background: var(--surface-2); }
.btn svg { width: 14px; height: 14px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-2); }
.btn--ghost { background: transparent; border-color: transparent; }

/* Animation dấu chấm "live" */
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .25; } }
.blink { animation: blink 1s step-start infinite; }

@media (prefers-reduced-motion: reduce) {
  .pulse, .blink { animation: none; }
}

/* =====================================================================
   THERMOSCADA — Layout: sidebar tối, topbar tối, content sáng
   ===================================================================== */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ---------------- Sidebar ---------------- */
.sidebar {
  background: linear-gradient(180deg, var(--shell-bg) 0%, var(--shell-bg-2) 100%);
  border-right: 1px solid var(--shell-line);
  display: flex; flex-direction: column;
  min-height: 0;
}
.brand {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: 11px;
  padding: 0 18px; border-bottom: 1px solid var(--shell-line);
}
.brand__logo { display: grid; place-items: center; filter: drop-shadow(0 2px 6px rgba(37,99,235,.4)); }
.brand__name { color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .04em; }
.brand__sub  { color: var(--shell-text-dim); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; }

.nav { flex: 1 1 auto; overflow-y: auto; padding: 12px 12px 8px; min-height: 0; }
.nav__group { margin-bottom: 6px; }
.nav__label {
  padding: 12px 10px 6px; font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--shell-text-dim);
}
.nav__item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 8.5px 11px; border-radius: var(--r); margin-bottom: 2px;
  color: var(--shell-text); font-size: 13.5px; font-weight: 550;
  position: relative; transition: background .12s, color .12s;
}
.nav__item svg { width: 18px; height: 18px; flex: none; opacity: .82; }
.nav__item:hover { background: rgba(255,255,255,.05); color: #dce6f5; }
.nav__item.is-active {
  background: linear-gradient(90deg, rgba(37,99,235,.22), rgba(37,99,235,.10));
  color: #fff;
}
.nav__item.is-active svg { opacity: 1; color: #7cc4ff; }
.nav__item.is-active::before {
  content: ""; position: absolute; left: -12px; top: 7px; bottom: 7px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--brand);
}
.nav__badge {
  margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--alarm); color: #fff; font-size: 10.5px; font-weight: 700;
  display: grid; place-items: center;
}
.nav__badge.is-zero { display: none; }

.sidebar__foot { flex: none; padding: 12px 16px; border-top: 1px solid var(--shell-line); }
.sidebar__foot .kv { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--shell-text-dim); padding: 2px 0; }
.sidebar__foot .kv b { color: var(--shell-text); font-weight: 600; }

/* ---------------- Main ---------------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------------- Topbar ---------------- */
.topbar {
  height: var(--topbar-h); flex: none;
  background: var(--shell-bg); border-bottom: 1px solid var(--shell-line);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  color: var(--shell-text);
}
.topbar__title { display: flex; flex-direction: column; }
.topbar__title h1 { font-size: 16px; font-weight: 750; color: #fff; letter-spacing: .01em; display: flex; align-items: center; gap: 9px; }
.topbar__title .tag-ivs {
  font-size: 9.5px; font-weight: 800; letter-spacing: .06em; color: #bcd6ff;
  background: rgba(37,99,235,.22); border: 1px solid rgba(124,196,255,.3);
  padding: 1px 6px; border-radius: 5px;
}
.topbar__title p { font-size: 11.5px; color: var(--shell-text-dim); }
.topbar__spacer { flex: 1 1 auto; }
.topbar__chips { display: flex; align-items: center; gap: 10px; }

.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; padding: 0 6px; }
.clock .t { font-size: 15px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock .d { font-size: 10.5px; color: var(--shell-text-dim); }

.user { display: flex; align-items: center; gap: 9px; padding-left: 14px; border-left: 1px solid var(--shell-line); }
.user__av { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#2563eb,#1746a2); color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; letter-spacing: .03em; }
.user__meta { line-height: 1.25; }
.user__meta .n { font-size: 12.5px; font-weight: 650; color: #fff; }
.user__meta .r { font-size: 10.5px; color: var(--shell-text-dim); }

/* ---------------- Content ---------------- */
.content { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 34px; outline: none; }
.content:focus-visible { outline: none; }

/* Grid dựng màn hình */
.page { max-width: 1720px; margin: 0 auto; }
.page__head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.page__head h2 { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.page__head .sub { font-size: 12.5px; color: var(--muted); }
.page__head .spacer { flex: 1 1 auto; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }
.span-4 { grid-column: span 4; }
.span-full { grid-column: 1 / -1; }

/* Bố cục 2 cột chính + rail phải */
.layout-rail { display: grid; grid-template-columns: 1fr 348px; gap: 14px; align-items: start; }

/* ---------------- Responsive ---------------- */
@media (max-width: 1400px) {
  .layout-rail { grid-template-columns: 1fr 320px; }
  .grid.cols-6 { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 1180px) {
  .app { grid-template-columns: 68px 1fr; }
  .brand { justify-content: center; padding: 0; }
  .brand__text, .nav__label, .sidebar__foot, .nav__item span { display: none; }
  .nav__item { justify-content: center; padding: 10px; }
  .nav__item.is-active::before { display: none; }
  .layout-rail { grid-template-columns: 1fr; }
  .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  .topbar { gap: 10px; padding: 0 14px; }
  .topbar__chips .chip { display: none; }
  .topbar__title h1 { white-space: nowrap; font-size: 15px; }
  .topbar__title p { display: none; }
}
@media (max-width: 720px) {
  .content { padding: 14px; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4, .grid.cols-6 { grid-template-columns: 1fr; }
  .span-2, .span-3, .span-4 { grid-column: span 1; }
  .topbar__title p { display: none; }
}

/* =====================================================================
   THERMOSCADA — Components
   ===================================================================== */

/* ---------------- Card / Panel ---------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}
.card__head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px 11px; border-bottom: 1px solid var(--line-2);
}
.card__head h3 { font-size: 13.5px; font-weight: 700; letter-spacing: .01em; }
.card__head .sub { font-size: 11.5px; color: var(--muted); }
.card__head .spacer { flex: 1 1 auto; }
.card__head svg.ico { width: 16px; height: 16px; color: var(--muted); }
.card__body { padding: 15px 16px; }
.card__body.tight { padding: 10px 12px; }
.card__foot { padding: 9px 16px; border-top: 1px solid var(--line-2); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* ---------------- KPI tile ---------------- */
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); opacity: .0; }
.kpi--ok::before    { background: var(--ok);    opacity: 1; }
.kpi--warn::before  { background: var(--warn);  opacity: 1; }
.kpi--alarm::before { background: var(--alarm); opacity: 1; }
.kpi--info::before  { background: var(--brand); opacity: 1; }
.kpi__top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.kpi__top .ico { width: 17px; height: 17px; color: var(--muted); }
.kpi__label { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.kpi__val { font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1.05; display: flex; align-items: baseline; gap: 5px; }
.kpi__val .unit { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.kpi__sub { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.kpi__spark { margin-top: 8px; }

/* ---------------- Metric row (nhãn · giá trị · trạng thái) ---------------- */
.metric { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line-2); }
.metric:last-child { border-bottom: none; }
.metric__ic { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-3); display: grid; place-items: center; flex: none; color: var(--muted); }
.metric__ic svg { width: 16px; height: 16px; }
.metric__main { min-width: 0; flex: 1 1 auto; }
.metric__name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric__tag { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); }
.metric__val { text-align: right; font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
.metric__val .v { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.metric__val .u { font-size: 11px; color: var(--muted); margin-left: 2px; }
.metric__bar { flex: none; width: 110px; }

/* Stat mini list */
.statlist { display: grid; gap: 0; }

/* Stat cell (ô số nhỏ trong lưới) */
.cellgrid { display: grid; gap: 1px; background: var(--line-2); border-radius: var(--r); overflow: hidden; }
.cell { background: var(--surface); padding: 11px 12px; }
.cell .k { font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.cell .v { font-size: 19px; font-weight: 720; letter-spacing: -.01em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.cell .v .u { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.cell .foot { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }

/* ---------------- Bar meter (thanh giá trị / tolerance band) ---------------- */
.meter { height: 7px; border-radius: 999px; background: var(--surface-3); position: relative; overflow: hidden; }
.meter__fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); transition: width .4s ease; }
.meter__fill.ok { background: var(--ok); }
.meter__fill.warn { background: var(--warn); }
.meter__fill.alarm { background: var(--alarm); }

/* Band meter (giải dung sai green/amber/red + kim) */
.band { position: relative; height: 12px; border-radius: 999px; overflow: hidden;
  background: linear-gradient(90deg,
    var(--alarm-wash) 0 12%, var(--warn-wash) 12% 28%, var(--ok-wash) 28% 72%,
    var(--warn-wash) 72% 88%, var(--alarm-wash) 88% 100%); }
.band__ticks { position: absolute; inset: 0; }
.band__needle { position: absolute; top: -3px; bottom: -3px; width: 2.5px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); transition: left .4s ease; }
.band__needle.ok { background: var(--ok-strong); }
.band__needle.warn { background: var(--warn-strong); }
.band__needle.alarm { background: var(--alarm-strong); }
.band__sp { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: rgba(15,30,51,.35); left: 50%; }
.band-wrap { display: grid; gap: 4px; }
.band-scale { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--muted-2); font-variant-numeric: tabular-nums; }

/* ---------------- Radial gauge ---------------- */
.gauge { display: grid; place-items: center; text-align: center; }
.gauge svg { overflow: visible; }
.gauge__val { font-size: 22px; font-weight: 760; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.gauge__val .u { font-size: 11px; font-weight: 600; color: var(--muted); }
.gauge__label { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 1px; }

/* ---------------- Table ---------------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .num, .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .c { text-align: center; }
.tbl .code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.tbl--rows tbody tr { transition: background .1s; }

/* ---------------- Alarm list ---------------- */
.alarm-item { display: flex; gap: 11px; padding: 11px 14px; border-bottom: 1px solid var(--line-2); position: relative; }
.alarm-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.alarm-item--high::before   { background: var(--alarm); }
.alarm-item--medium::before { background: var(--warn); }
.alarm-item--low::before    { background: var(--muted-2); }
.alarm-item__body { flex: 1 1 auto; min-width: 0; }
.alarm-item__top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.alarm-item__time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.alarm-item__sev { font-size: 9.5px; font-weight: 800; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.sev-high   { background: var(--alarm-wash); color: var(--alarm-strong); }
.sev-medium { background: var(--warn-wash);  color: var(--warn-strong); }
.sev-low    { background: var(--surface-3);  color: var(--muted); }
.alarm-item__state { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.state-active { color: var(--alarm-strong); }
.state-ack    { color: var(--warn-strong); }
.state-cleared{ color: var(--ok-strong); }
.alarm-item__tag { font-family: var(--mono); font-size: 12px; font-weight: 650; color: var(--ink); }
.alarm-item__msg { font-size: 12px; color: var(--ink-2); }

/* ---------------- Comm / device status rows ---------------- */
.dev-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line-2); }
.dev-row:last-child { border-bottom: none; }
.dev-row .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dev-row .nm { font-size: 12.5px; font-weight: 600; }
.dev-row .ip { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.dev-row .ms { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 650; }

/* ---------------- Trend canvas ---------------- */
.trend { position: relative; width: 100%; }
.trend canvas { display: block; width: 100%; }
.trend__legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.trend__legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 550; }
.trend__legend .sw { width: 14px; height: 3px; border-radius: 2px; }
.trend__legend .sw.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); height: 2px; }

/* Sparkline inline */
.spark { display: block; }

/* ---------------- P&ID diagram ---------------- */
.pid { width: 100%; background:
    linear-gradient(var(--surface-2) 0 0) padding-box,
    repeating-linear-gradient(0deg, var(--line-2) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 26px);
  border-radius: var(--r); border: 1px solid var(--line);
}
.pid svg { width: 100%; height: auto; }
.pid text { font-family: var(--font); }
.pid .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { .pid .flow { animation: none; } }
.pid .eqbox { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.3; }
.pid .eqlabel { font-size: 10px; font-weight: 700; fill: var(--ink-2); }
.pid .eqname { font-size: 8.5px; fill: var(--muted); }
.pid .isa { fill: #fff; stroke: var(--line-strong); stroke-width: 1.3; }
.pid .isacode { font-size: 8px; font-weight: 700; fill: var(--muted); }
.pid .isaval { font-size: 11px; font-weight: 750; fill: var(--ink); font-variant-numeric: tabular-nums; }

/* Instrument bubble (ISA) trong SVG dùng class */
.legend-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 11.5px; color: var(--muted); }
.legend-row .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend-row .lg .d { width: 9px; height: 9px; border-radius: 50%; }

/* ---------------- Progress ring cluster (health) ---------------- */
.health-bar { display: grid; gap: 9px; }
.health-bar .hb { display: grid; grid-template-columns: 78px 1fr 34px; align-items: center; gap: 9px; font-size: 12px; }
.health-bar .hb .lbl { color: var(--ink-2); font-weight: 600; }
.health-bar .hb .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------------- Divider / misc ---------------- */
.hr { height: 1px; background: var(--line-2); border: none; margin: 12px 0; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mb-2{margin-bottom:8px}
.gap-lg{gap:14px}

/* Unit selector pill (topbar-ish inside content) */
.unit-tabs { display: inline-flex; gap: 6px; }
.unit-tab {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface);
  font-weight: 650; font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow-sm);
}
.unit-tab .d { width: 8px; height: 8px; border-radius: 50%; }
.unit-tab.is-active { border-color: var(--brand); background: var(--brand-wash); color: var(--brand-ink); }

/* Big value readout (như bảng số trên sơ đồ) */
.readout { display: inline-flex; flex-direction: column; }
.readout .v { font-size: 24px; font-weight: 780; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.readout .v .u { font-size: 12px; font-weight: 600; color: var(--muted); }

/* Equipment status pill trên sơ đồ */
.eq { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-sm); padding: 8px 10px; }
.eq__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eq__code { font-family: var(--mono); font-size: 11px; font-weight: 650; color: var(--ink-2); }
.eq__name { font-size: 10px; color: var(--muted); }
.eq__val { font-size: 17px; font-weight: 760; margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Empty / placeholder */
.empty { text-align: center; color: var(--muted); padding: 30px; font-size: 13px; }
.empty svg { width: 26px; height: 26px; opacity: .45; margin: 0 auto 6px; }

/* Toast for ack */
.toast-wrap { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--r); font-size: 12.5px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; animation: toastin .2s ease; }
@keyframes toastin { from { opacity: 0; transform: translateY(6px); } }

/* ================= Equipment faceplate (drill-down chi tiết) ================= */
/* Thiết bị bấm được trên sơ đồ P&ID */
.pid .eqg.clickable { cursor: pointer; }
.pid .eqg.clickable .eqbox { transition: stroke .12s, stroke-width .12s; }
.pid .eqg.clickable:hover .eqbox { stroke: var(--brand); stroke-width: 2.2; }
.pid .eqg.clickable:hover .eqlabel { fill: var(--brand); }
.pid .eqg.clickable:focus-visible { outline: none; }
.pid .eqg.clickable:focus-visible .eqbox { stroke: var(--brand); stroke-width: 2.2; }
.pid-hint { display: inline-flex; align-items: center; gap: 6px; margin: 8px 2px 0; font-size: 11.5px; color: var(--muted); }
.pid-hint svg { width: 14px; height: 14px; opacity: .8; }

/* Thẻ thiết bị bấm được */
.eq.clickable { cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; }
.eq.clickable:hover { border-color: var(--brand); box-shadow: var(--shadow-sm); transform: translateY(-1px); }

/* Overlay + hộp faceplate */
.fp-overlay { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center;
  background: rgba(8, 18, 30, .55); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); padding: 18px; }
.fp-overlay.is-open { display: flex; animation: fp-fade .14s ease; }
@keyframes fp-fade { from { opacity: 0; } to { opacity: 1; } }
body.fp-lock { overflow: hidden; }

.fp { width: min(560px, 100%); max-height: calc(100vh - 36px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: var(--shadow-lg); animation: fp-pop .16s ease; }
@keyframes fp-pop { from { transform: translateY(10px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }

.fp__head { display: flex; align-items: center; gap: 11px; padding: 14px 14px 11px; border-bottom: 1px solid var(--line); }
.fp__ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--brand-wash); color: var(--brand); }
.fp__ic svg { width: 21px; height: 21px; }
.fp__ttl { flex: 1; min-width: 0; }
.fp__code { font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.fp__name { font-size: 15.5px; font-weight: 750; color: var(--ink); line-height: 1.2; }
.fp__badge { flex: none; }
.fp__x { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: none; background: transparent;
  color: var(--muted-2); border-radius: 8px; cursor: pointer; transition: all .12s; }
.fp__x:hover { background: var(--surface-3); color: var(--ink); }
.fp__desc { padding: 9px 15px 0; font-size: 12.5px; color: var(--muted); }
.fp__body { display: grid; grid-template-columns: 172px 1fr; gap: 4px 16px; align-items: center; padding: 6px 16px 10px; }
.fp__gauge { display: grid; place-items: center; padding: 4px 0; }
.fp__list { display: grid; }
.fp__list .metric:last-child { border-bottom: none; }
.fp__foot { display: flex; align-items: center; gap: 10px; padding: 11px 15px 14px; border-top: 1px solid var(--line); }
.fp__hint { flex: 1; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.fp__hint .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
@media (max-width: 560px) { .fp__body { grid-template-columns: 1fr; } }

/* ============ P&ID theme system: classic (3D) vs HP-HMI (ISA-101) ============ */
/* Mặc định = classic (nền sáng, thiết bị gradient 3D). Biến --pid-* dùng trong SVG. */
.pid {
  --pid-canvas: var(--surface);
  --pid-panel: var(--surface-3);
  --pid-line: var(--line-strong);
  --pid-line2: #9aa7b6;
  --pid-dim: var(--muted);
  --pid-genink: #7a5410;
  --pid-shaft: #2d4c72;
}

.pid [data-fill="vessel"] { fill: url(#gVessel); }
.pid [data-fill="turbo"]  { fill: url(#gTurbo); }
.pid [data-fill="gen"]    { fill: url(#gGen); }
.pid [data-fill="coal"]   { fill: url(#gCoal); }
.pid [data-fill="flame"]  { fill: url(#gFlame); }

  --pid-panel: #222a33;

  --pid-genink: #d7dee6;

  border-radius: 6px;

.pid.hmi-hp .eqbox   { fill: #222a33; stroke: #8a939c; }

.pid.hmi-hp .eqg.clickable:hover .eqlabel { fill: #4c9aff; }

/* Nút chuyển 2 theme trong header sơ đồ */
.pid-theme { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-pill); overflow: hidden; height: 26px; }

/* =====================================================================
   THERMOSCADA — Formatting helpers
   ===================================================================== */
(function (global) {
  'use strict';

  function fmt(v, dp) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    dp = dp == null ? 1 : dp;
    return Number(v).toLocaleString('vi-VN', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function fmt0(v) { return fmt(v, 0); }
  function sign(v, dp) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    var s = fmt(Math.abs(v), dp == null ? 1 : dp);
    return (v > 0 ? '+' : v < 0 ? '−' : '') + s;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function clockTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  var DOW = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
  function longDate(d) {
    return DOW[d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  // dao động ngẫu nhiên có xu hướng quay về giá trị nền
  function drift(cur, base, amp, spring) {
    var noise = (Math.random() - 0.5) * amp;
    return cur + (base - cur) * (spring == null ? 0.05 : spring) + noise;
  }
  function pct(v, lo, hi) { return clamp((v - lo) / (hi - lo), 0, 1); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

    fmt: fmt, fmt0: fmt0, sign: sign, pad: pad,
    clockTime: clockTime, hm: hm, longDate: longDate,
    clamp: clamp, lerp: lerp, drift: drift, pct: pct, escapeHtml: escapeHtml

(function (global) {

  var CHS = [

              '<div class="card"><div class="card__head">' + C.icon('activity', 'ico') + '<h3>Sản lượng toàn nhà máy theo giờ</h3><div class="spacer"></div>' + C.legend([{ label: 'Công suất (MW)', color: 'var(--series-1)' }]) + '</div><div class="card__body" id="rp-bars">' + hourlyBars() + '</div></div>' +
            '</div>' +
            '<div class="grid" style="gap:14px">' +
              '<div class="card"><div class="card__head">' + C.icon('smoke', 'ico') + '<h3>Phát thải trung bình ca</h3></div><div class="card__body tight" id="rp-emis">' + emissionTable() + '</div></div>' +
              '<div class="card"><div class="card__head">' + C.icon('check', 'ico') + '<h3>Chỉ tiêu vận hành</h3></div><div class="card__body" id="rp-op">' + opCells() + '</div></div>' +
              '<div class="card"><div class="card__body"><div class="dim" style="font-size:12px;line-height:1.6">Báo cáo tự động tổng hợp từ historian. Số liệu mang tính minh hoạ (mô phỏng). Ký duyệt: Trưởng ca · Trưởng kíp lò máy · Trưởng kíp điện.</div></div></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      this._root = root;
    },
    update: function () {
      var root = this._root; if (!root) return;
      root.querySelector('#rp-kpi').innerHTML = kpis();
      root.querySelector('#rp-balance').innerHTML = balanceTable();
      root.querySelector('#rp-emis').innerHTML = emissionTable();
      root.querySelector('#rp-op').innerHTML = opCells();
    }
  };
})(window);

/* =====================================================================
   VIEW · Cấu hình hệ thống (Assets / Devices / Users / Settings)

  var V = global.Views = global.Views || {};
  var tab = 'assets';

    { code: 'TG-1/2', name: 'Tua-bin', type: 'Tua-bin ngưng hơi 3 thân', tags: 22, area: 'Máy' },
    { code: 'GEN-1/2', name: 'Máy phát', type: 'Máy phát đồng bộ 20 kV', tags: 14, area: 'Điện' },
    { code: 'GSU-1/2', name: 'MBA tăng áp', type: 'MBA 20/220 kV · 370 MVA', tags: 8, area: 'Trạm' },
    { code: 'COND-1/2', name: 'Bình ngưng', type: 'Bình ngưng bề mặt', tags: 10, area: 'Máy' },
    { code: 'CT-1/2', name: 'Tháp giải nhiệt', type: 'Tháp giải nhiệt cưỡng bức', tags: 9, area: 'BOP' },
    { code: 'MILL-1A..E', name: 'Máy nghiền', type: 'Máy nghiền bi trung tốc', tags: 30, area: 'Nhiên liệu' },
    { code: 'FGD-1/2', name: 'Khử lưu huỳnh', type: 'FGD ướt đá vôi–thạch cao', tags: 12, area: 'Môi trường' },
    { code: 'ESP-1/2', name: 'Lọc bụi tĩnh điện', type: 'ESP 4 trường', tags: 11, area: 'Môi trường' }
  ];
  var USERS = [
    { name: 'Trần Xuân Hoan', acc: 'op.hoan', role: 'Kỹ sư vận hành', perm: 'Vận hành · Ack', st: 'ok' },
    { name: 'Nguyễn Văn Tuấn', acc: 'op.tuan', role: 'Trưởng kíp', perm: 'Vận hành · Điều độ', st: 'ok' },
    { name: 'Quản trị hệ thống', acc: 'admin', role: 'Quản trị', perm: 'Toàn quyền', st: 'ok' },
    { name: 'Phòng Kỹ thuật', acc: 'kt.view', role: 'Kỹ thuật', perm: 'Chỉ xem · Báo cáo', st: 'ok' },
    { name: 'Sở TN&MT (CEMS)', acc: 'env.gov', role: 'Cơ quan quản lý', perm: 'Chỉ xem khí thải', st: 'ext' }
  ];

  function tabs() {
    var items = [['assets', 'Tài sản', 'layers'], ['devices', 'Thiết bị I/O', 'device'], ['users', 'Người dùng', 'users'], ['settings', 'Cài đặt', 'settings']];
    return '<div class="unit-tabs" id="cf-tabs">' + items.map(function (it) {
      return '<button class="unit-tab' + (tab === it[0] ? ' is-active' : '') + '" data-tab="' + it[0] + '">' + C.icon(it[2], '', 1.7) + ' ' + it[1] + '</button>';
    }).join('') + '</div>';
  }

  function assetsTable() {
    return '<div class="card"><div class="card__head">' + C.icon('layers', 'ico') + '<h3>Danh mục tài sản</h3><div class="spacer"></div><span class="sub">' + ASSETS.length + ' nhóm thiết bị</span><button class="btn" style="margin-left:10px">' + C.icon('settings') + 'Thêm</button></div>' +
      '<div class="card__body tight"><table class="tbl"><thead><tr><th>Mã tài sản</th><th>Tên</th><th>Loại thiết bị</th><th>Khu vực</th><th class="r">Số tag</th><th>Trạng thái</th></tr></thead><tbody>' +
      ASSETS.map(function (a) {
        return '<tr><td class="code">' + a.code + '</td><td>' + a.name + '</td><td class="dim">' + a.type + '</td><td>' + a.area + '</td><td class="r num">' + a.tags + '</td><td>' + C.badge('ok', 'Đang giám sát') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function devicesTable() {
    return '<div class="card"><div class="card__head">' + C.icon('device', 'ico') + '<h3>Thiết bị đầu cuối (RTU / IO / CEMS)</h3><div class="spacer"></div><span class="sub">IEC 60870-5-104 · ' + S.PLANT.scan + ' ms</span></div>' +
      '<div class="card__body tight"><table class="tbl"><thead><tr><th>Thiết bị</th><th>Địa chỉ IP</th><th>Giao thức</th><th class="r">Chu kỳ quét</th><th class="r">Trễ (ping)</th><th>Trạng thái</th></tr></thead><tbody>' +
      (S.devices || []).map(function (d) {
        var off = d.st === 'off';
        return '<tr><td class="code">' + d.id + '<div class="dim" style="font-size:10.5px">' + d.role + '</div></td><td class="mono">' + d.ip + '</td><td class="dim">IEC-104</td>' +
          '<td class="r num">' + S.PLANT.scan + ' ms</td><td class="r num">' + (off ? '—' : d.ms + ' ms') + '</td>' +
          '<td>' + (off ? C.badge('alarm', 'Offline') : C.badge('ok', 'Trực tuyến')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function usersTable() {
    return '<div class="card"><div class="card__head">' + C.icon('users', 'ico') + '<h3>Người dùng & Phân quyền</h3><div class="spacer"></div><button class="btn">' + C.icon('users') + 'Thêm người dùng</button></div>' +
      '<div class="card__body tight"><table class="tbl"><thead><tr><th>Họ tên</th><th>Tài khoản</th><th>Vai trò</th><th>Quyền hạn</th><th>Trạng thái</th></tr></thead><tbody>' +
      USERS.map(function (u) {
        return '<tr><td style="font-weight:600">' + u.name + '</td><td class="code">' + u.acc + '</td><td>' + u.role + '</td><td class="dim">' + u.perm + '</td>' +
          '<td>' + (u.st === 'ext' ? C.badge('info', 'Bên ngoài') : C.badge('ok', 'Kích hoạt')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function settings() {
    function group(icon, title, rows) {
      return '<div class="card"><div class="card__head">' + C.icon(icon, 'ico') + '<h3>' + title + '</h3></div><div class="card__body"><div class="cellgrid" style="grid-template-columns:1fr 1fr">' +
        rows.map(function (r) { return '<div class="cell"><div class="k">' + r[0] + '</div><div class="v" style="font-size:15px">' + r[1] + '</div></div>'; }).join('') + '</div></div></div>';
    }
    return '<div class="grid cols-2">' +
      group('factory', 'Hệ thống', [['Tên nhà máy', S.PLANT.name], ['Địa điểm', S.PLANT.site], ['Cấu hình', S.PLANT.config], ['Phiên bản', 'ThermoSCADA 1.0']]) +
      group('device', 'Truyền thông', [['Giao thức', 'IEC 60870-5-104'], ['Chu kỳ quét', S.PLANT.scan + ' ms'], ['Dự phòng', 'Hot-standby A/B'], ['Đồng bộ giờ', 'NTP · GPS']]) +
      group('report', 'Historian', [['Cơ sở dữ liệu', 'PostgreSQL / TimescaleDB'], ['Lưu trữ', '3 năm · nén 1s'], ['Số điểm đo', Object.keys(S.SPEC).length * 2 + ' tag'], ['Sao lưu', 'Hằng ngày 02:00']]) +
      group('settings', 'Giao diện & Đơn vị', [['Ngôn ngữ', 'Tiếng Việt'], ['Đơn vị', 'SI · °C · bar · MW'], ['Múi giờ', 'UTC+7 (ICT)'], ['Chế độ', 'Chỉ đọc · Giám sát']]) +
      '</div>';
  }

  function content() {
    if (tab === 'assets') return assetsTable();
    if (tab === 'devices') return devicesTable();
    if (tab === 'users') return usersTable();
    return settings();
  }

  V.config = {
    title: 'Cấu hình hệ thống',
    subtitle: 'Assets · Devices · Users · Settings',
    render: function (root) {
      root.innerHTML =
        '<div class="page">' +
          '<div class="page__head"><h2>Cấu hình hệ thống</h2><span class="sub">Tài sản · thiết bị I/O · người dùng · cài đặt</span><div class="spacer"></div>' + tabs() + '</div>' +
          '<div id="cf-content">' + content() + '</div>' +
        '</div>';
      root.querySelector('#cf-tabs').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-tab]'); if (!b) return;
        tab = b.getAttribute('data-tab');
        root.querySelectorAll('#cf-tabs button').forEach(function (x) { x.classList.toggle('is-active', x === b); });
        root.querySelector('#cf-content').innerHTML = content();
      });
      this._root = root;
    },
    update: function () {
      var root = this._root; if (!root) return;
      if (tab === 'devices') root.querySelector('#cf-content').innerHTML = content();
    }
  };
})(window);

/* =====================================================================
   THERMOSCADA — Bootstrap
   ===================================================================== */
(function (global) {
  'use strict';
  var S = global.Store, C = global.C, F = global.F, Router = global.Router, Engine = global.Engine, V = global.Views || {};

  /* ---- Cấu trúc điều hướng ---- */
  var NAV = [
    { label: 'Giám sát', items: [
      { id: 'overview',   name: 'Tổng quan nhà máy',   icon: 'factory' },
      { id: 'boiler',     name: 'Lò hơi & Đốt',        icon: 'flame' },
      { id: 'turbine',    name: 'Tua-bin & Máy phát',  icon: 'rotor' },
      { id: 'feedwater',  name: 'Nước cấp & Ngưng tụ', icon: 'drop' },
      { id: 'cooling',    name: 'Nước làm mát',        icon: 'tower' },
      { id: 'fuel',       name: 'Cấp nhiên liệu',      icon: 'coal' },
      { id: 'electrical', name: 'Điện & Trạm phân phối',icon: 'bolt' },
      { id: 'emissions',  name: 'Khí thải & CEMS',     icon: 'smoke' }
    ]},
    { label: 'Vận hành', items: [
      { id: 'alarms',  name: 'Cảnh báo & Sự kiện', icon: 'bell', badge: true },
      { id: 'trends',  name: 'Historian & Xu hướng', icon: 'activity' },
      { id: 'reports', name: 'Báo cáo', icon: 'report' }
    ]},
    { label: 'Cấu hình', items: [
      { id: 'config', name: 'Cấu hình hệ thống', icon: 'settings' }
    ]}
  ];

  /* ---- Sidebar nav ---- */
  function buildNav() {
    var nav = document.getElementById('nav');
    nav.innerHTML = NAV.map(function (g) {
      return '<div class="nav__group"><div class="nav__label">' + g.label + '</div>' +
        g.items.map(function (it) {
          return '<a class="nav__item" href="#/' + it.id + '" data-id="' + it.id + '">' +
            C.icon(it.icon) + '<span>' + it.name + '</span>' +
            (it.badge ? '<span class="nav__badge is-zero" data-alarm-badge>0</span>' : '') + '</a>';
        }).join('') + '</div>';
    }).join('');
  }

  /* ---- Topbar ---- */
  function buildTopbar() {
    var tb = document.getElementById('topbar');
    tb.innerHTML =
      '<div class="topbar__title"><h1 id="tb-title">Tổng quan</h1><p id="tb-sub">' + S.PLANT.name + '</p></div>' +
      '<div class="topbar__spacer"></div>' +
      '<div class="topbar__chips">' +
        '<span class="chip">' + C.icon('factory') + '<b>' + S.PLANT.site + '</b> · ' + S.PLANT.config + '</span>' +
        '<span class="chip">' + C.icon('device') + 'IEC-104 · <b>' + S.PLANT.scan + ' ms</b></span>' +
        '<span class="chip"><span class="dot" style="background:var(--ok)"></span><span class="pulse">Trực tuyến</span> · Mô phỏng</span>' +
        '<div class="clock"><span class="t" id="tb-clock">--:--:--</span><span class="d" id="tb-date">—</span></div>' +
        '<div class="user"><div class="user__av">TXH</div><div class="user__meta"><div class="n">Trần Xuân Hoan</div><div class="r">Kỹ sư vận hành</div></div></div>' +
      '</div>';
  }

  /* ---- Cập nhật topbar + badge theo tick ---- */
  function tickChrome() {
    var c = document.getElementById('tb-clock'); if (c) c.textContent = F.clockTime(S.now);
    var d = document.getElementById('tb-date'); if (d) d.textContent = F.longDate(S.now) + ' · UTC+7';
    var n = S.unacked();
    document.querySelectorAll('[data-alarm-badge]').forEach(function (b) {
      b.textContent = n; b.classList.toggle('is-zero', n === 0);
    });
  }

  /* ---- Khởi động ---- */
  function boot() {
    Engine.init();
    buildNav();
    buildTopbar();

    // đăng ký view
    Object.keys(V).forEach(function (id) { Router.register(id, V[id]); });

    Router.onChange(function (id, view) {
      document.querySelectorAll('.nav__item').forEach(function (a) { a.classList.toggle('is-active', a.getAttribute('data-id') === id); });
      var t = document.getElementById('tb-title'); if (t) t.textContent = view.title || '';
      var s = document.getElementById('tb-sub'); if (s) s.textContent = view.subtitle || S.PLANT.name;
      document.title = (view.title || 'ThermoSCADA') + ' · ThermoSCADA';
    });

    // Bắt sự kiện click chung cho mọi view (event delegation)
    document.getElementById('view').addEventListener('click', function (e) {
      var pt = e.target.closest('[data-pidtheme]');
      if (pt) { if (global.M) global.M.setTheme(pt.getAttribute('data-pidtheme')); return; }
      var fp = e.target.closest('[data-fp]');
      if (fp) { if (global.Faceplate) global.Faceplate.open(fp.getAttribute('data-fp')); return; }
      var u = e.target.closest('[data-unit]');
      if (u) { S.setUnit(u.getAttribute('data-unit')); Router.go(Router.current()); return; }
      var n = e.target.closest('[data-nav]');
      if (n) { Router.go(n.getAttribute('data-nav')); return; }
      var aa = e.target.closest('[data-ackall]');
      if (aa) { S.ackAll(); return; }
      var a = e.target.closest('[data-ack]');
      if (a) { S.ackAlarm(a.getAttribute('data-ack')); return; }
    });

    S.subscribe(tickChrome);
    Router.start();
    Engine.start();
    tickChrome();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

  </script>

  <!-- Views -->

  <!-- Bootstrap -->
</body>
</html>
