name: Deploy ThermoSCADA to GitHub Pages

# Đưa hệ SCADA (web tĩnh) lên GitHub Pages.
# Bật một lần: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: ["claude/scada-web-thermal-plant-wgng15"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages (tự bật Pages nếu chưa bật)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site (toàn bộ file tĩnh ở gốc repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
